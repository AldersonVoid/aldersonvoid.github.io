<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#E63946" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#08090B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#08090B" stop-opacity="1"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#08090B"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Border Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="8" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Corner Accents -->
  <path d="M 36 60 L 36 36 L 60 36" fill="none" stroke="#E63946" stroke-width="2"/>
  <path d="M 1164 60 L 1164 36 L 1140 36" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2"/>
  <path d="M 36 570 L 36 594 L 60 594" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2"/>
  <path d="M 1164 570 L 1164 594 L 1140 594" fill="none" stroke="#E63946" stroke-width="2"/>

  <!-- Top Metadata -->
  <text x="90" y="115" font-family="'JetBrains Mono', monospace" font-size="14" fill="#858990" letter-spacing="4">DIGITAL IDENTITY / EST. IN THE UNKNOWN</text>
  <circle cx="80" cy="111" r="3" fill="#E63946"/>

  <!-- Main Headline -->
  <text x="90" y="240" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="92" fill="#F0F0F0" letter-spacing="-2">AldersonVoid<tspan fill="#E63946">.</tspan></text>

  <!-- Tagline -->
  <text x="90" y="315" font-family="'Inter', sans-serif" font-weight="300" font-style="italic" font-size="28" fill="#F0F0F0" opacity="0.9">"Somewhere between code and the unknown."</text>

  <!-- Description -->
  <text x="90" y="380" font-family="'Inter', sans-serif" font-size="20" fill="#858990">An independent mind exploring technology, code, cybersecurity,</text>
  <text x="90" y="412" font-family="'Inter', sans-serif" font-size="20" fill="#858990">and the endless possibilities of the digital world.</text>

  <!-- Bottom Divider Line -->
  <line x1="90" y1="475" x2="1110" y2="475" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Bottom Line -->
  <text x="90" y="525" font-family="'JetBrains Mono', monospace" font-size="13" fill="#52565E" letter-spacing="3">THINK DEEPLY. BUILD QUIETLY. EXPLORE LIMITLESSLY.</text>
  <text x="980" y="525" font-family="'JetBrains Mono', monospace" font-size="13" fill="#858990" letter-spacing="2">aldersonvoid.github.io</text>
</svg>
